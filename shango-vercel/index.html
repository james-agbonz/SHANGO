<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shango Thunder Core</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=JetBrains+Mono:wght@400;500&family=Archivo:wght@400;500&display=swap">
<style>
/* Layout: one object in the dark. A 3D thunder core fills the void; instruments sit at the edges;
   research rises as a curved wall of panels. Single committed dark world: black, thunder red, white, a thread of royal gold. */
:root {
  color-scheme: dark;
  --void: #040303;
  --red: #ff2d2d;
  --ember: #ff6a4d;
  --white: #f4efe9;
  --gold: #d9a845;
  --ice: #cfe3ff;
  --muted: #8b7f7a;
  --hair: rgba(244, 239, 233, 0.16);
  --hair-strong: rgba(244, 239, 233, 0.32);
  --panel: rgba(12, 9, 9, 0.78);
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --ring: 160px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--white); font: 15px/1.5 var(--body); overflow: hidden; }
:focus-visible { outline: 1px solid var(--red); outline-offset: 3px; }
button { font: inherit; color: inherit; }

#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.75) 100%); }

/* ---------- top bar ---------- */
.top {
  position: fixed; inset: 0 0 auto; z-index: 20;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 22px; height: 22px; }
.brand b { font: 800 18px/1 var(--display); letter-spacing: .28em; }
.brand span { font: 400 10px var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.status { margin-inline: auto; display: inline-flex; align-items: center; gap: 8px;
  font: 500 10.5px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--white); box-shadow: 0 0 8px var(--white); }
.status[data-s="listening"], .status[data-s="listening"] i { color: var(--red); background: none; }
.status[data-s="listening"] i, .status[data-s="thinking"] i, .status[data-s="researching"] i, .status[data-s="waking"] i { background: var(--red); box-shadow: 0 0 10px var(--red); }
.status[data-s="speaking"] i { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.status[data-s="speaking"] { color: var(--gold); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tbtn {
  font: 500 10px var(--mono); letter-spacing: .16em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--hair); padding: 6px 10px; cursor: pointer; color: var(--white);
}
.tbtn:hover { border-color: var(--red); color: var(--red); }
.tbtn[aria-pressed="false"] { color: var(--muted); }
.tbtn.wake { border-color: rgba(255,45,45,.6); color: var(--red); }
.tbtn.wake:hover { background: rgba(255,45,45,.12); }
body.flash::after { content: ""; position: fixed; inset: 0; z-index: 40; pointer-events: none; background: rgba(255,240,230,.18); animation: fl .5s ease-out forwards; }
@keyframes fl { to { opacity: 0; } }
.timers { position: fixed; top: calc(52px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 19;
  display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.timers span { font: 500 10.5px var(--mono); letter-spacing: .12em; color: var(--gold); border: 1px solid rgba(217,168,69,.4); padding: 3px 9px; background: rgba(4,3,3,.7); font-variant-numeric: tabular-nums; }

/* ---------- emblem (idle logo inside the ring) ---------- */
.emblem {
  position: fixed; left: 50%; top: 50%; z-index: 5; pointer-events: none;
  transform: translate(-50%, -50%); width: calc(var(--ring) * 1.7);
  display: grid; justify-items: center; gap: calc(var(--ring) * .04);
  transition: opacity .6s ease, transform .6s ease;
}
.emblem svg { width: calc(var(--ring) * .42); height: auto; filter: drop-shadow(0 0 10px rgba(255,45,45,.7)); }
.emblem b {
  font: 900 calc(var(--ring) * .3)/.9 var(--display); letter-spacing: .12em; padding-left: .12em;
  color: var(--white); text-shadow: 0 0 18px rgba(255,45,45,.85), 0 0 2px #fff;
}
.emblem small { font: 500 calc(max(9px, var(--ring) * .055)) var(--mono); letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
body.active .emblem { opacity: 0; transform: translate(-50%, -50%) scale(.9); }
body.nogl .emblem::before { content: ""; position: absolute; left: 50%; top: 50%; width: calc(var(--ring) * 2); aspect-ratio: 1; max-width: 90vw;
  transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--red); box-shadow: 0 0 30px rgba(255,45,45,.6), inset 0 0 30px rgba(255,45,45,.4); }
body.nogl.active .emblem { opacity: 1; }

/* reply subtitle */
.subtitle {
  position: fixed; left: 50%; z-index: 6; transform: translateX(-50%);
  top: calc(50% + var(--ring) * 1.95); width: min(640px, calc(100% - 40px));
  text-align: center; font: 400 17px/1.45 var(--body); text-wrap: balance; color: var(--white);
  text-shadow: 0 0 20px #000, 0 0 4px #000; min-height: 1.45em;
}
body.walled .subtitle { opacity: 0; }

/* ---------- bottom instruments ---------- */
.bottom {
  position: fixed; inset: auto 0 0; z-index: 20;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px) minmax(0, 1fr); align-items: end; gap: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-top: 10px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.live { font: 400 11.5px/1.5 var(--mono); color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live em { font-style: normal; color: var(--white); }
.composer { display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--hair); background: rgba(8,6,6,.72); backdrop-filter: blur(10px); }
#mic { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--hair-strong); background: transparent; color: var(--white); display: grid; place-items: center; cursor: pointer; }
#mic svg { width: 18px; height: 18px; }
#mic[aria-pressed="true"] { color: var(--red); border-color: var(--red); box-shadow: 0 0 18px rgba(255,45,45,.6); }
#q { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--white); font: 15px var(--body); padding: 8px 4px; }
#q:focus { outline: none; }
#q::placeholder { color: var(--muted); }
#send { flex: none; width: 42px; height: 42px; border: 0; background: var(--red); color: #fff; display: grid; place-items: center; cursor: pointer; }
#send svg { width: 18px; height: 18px; }
.meter { justify-self: end; display: flex; align-items: center; gap: 10px; font: 500 10px var(--mono); letter-spacing: .16em; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
.bars i { width: 3px; background: var(--hair-strong); height: 20%; transition: height .08s; }
.bars i.hot { background: var(--red); }
.chips { position: fixed; left: 50%; transform: translateX(-50%); z-index: 20; bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: min(640px, calc(100% - 32px)); }
.chip { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--white); background: rgba(8,6,6,.6); border: 1px solid var(--hair); padding: 6px 10px; cursor: pointer; }
.chip:hover { border-color: var(--red); color: var(--red); }

/* ---------- transcript drawer ---------- */
.drawer {
  position: fixed; z-index: 30; top: 0; bottom: 0; right: 0; width: min(380px, 100%);
  background: rgba(8,6,6,.94); border-left: 1px solid var(--hair); backdrop-filter: blur(12px);
  display: grid; grid-template-rows: auto minmax(0, 1fr);
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--hair); font: 500 10.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.log { overflow-y: auto; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.entry .who { font: 500 9.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.entry.ai .who { color: var(--red); }
.entry.tool .who { color: var(--gold); }
.entry p { margin: 3px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.entry.tool p { font: 12px var(--mono); color: var(--muted); }

/* ---------- research card ---------- */
.rcard {
  position: fixed; left: 50%; top: 50%; z-index: 25; transform: translate(-50%, -50%);
  width: min(440px, calc(100% - 40px)); padding: 16px 18px 14px;
  border: 1px solid rgba(207,227,255,.55); background: rgba(6,8,12,.88);
  box-shadow: 0 0 0 1px rgba(207,227,255,.08), 0 0 40px rgba(120,170,255,.18);
}
.rcard .row { display: flex; justify-content: space-between; gap: 12px; font: 500 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.rcard .row b { color: var(--gold); font-weight: 500; }
.rcard h3 { margin: 10px 0 2px; font: 800 30px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.rcard .stage { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ice); }
.segs { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin: 12px 0 10px; }
.segs i { height: 8px; background: rgba(207,227,255,.12); }
.segs i.on { background: var(--ice); box-shadow: 0 0 8px rgba(207,227,255,.7); }

/* ---------- research wall ---------- */
.wall {
  position: fixed; inset: 0; z-index: 15; overflow-y: auto;
  padding-top: calc(64px + env(safe-area-inset-top, 0px)); padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(4,3,3,.55), rgba(4,3,3,.9));
}
.wall-head { max-width: 1320px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.wall-head h2 { margin: 0; font: 900 clamp(30px, 4vw, 52px)/.95 var(--display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
.wall-head p { margin: 0; font: 500 10.5px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.wall-head p b { color: var(--red); font-weight: 500; }
.wall-grid { max-width: 1320px; margin: 0 auto; display: grid; align-items: start; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; perspective: 1800px; }
.panel {
  position: relative; min-width: 0; padding: 14px 16px 12px;
  background: var(--panel); border: 1px solid var(--hair-strong);
  box-shadow: 0 0 0 1px rgba(255,255,255,.03), 0 18px 40px rgba(0,0,0,.5);
  transform: rotateY(var(--ry, 0deg)); transform-origin: center;
  animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s);
}
.panel::before { content: ""; position: absolute; left: -1px; top: -1px; width: 12px; height: 12px; border-left: 2px solid var(--red); border-top: 2px solid var(--red); }
.panel.wide { grid-column: span 2; }
.panel .k { display: flex; justify-content: space-between; gap: 8px; font: 500 9.5px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.panel .k b { color: var(--red); font-weight: 500; }
.panel h3 { margin: 8px 0 6px; font: 800 21px/1.02 var(--display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
.panel p { margin: 0; font-size: 13.5px; line-height: 1.5; color: rgba(244,239,233,.82); }
.panel .src { margin-top: 10px; font: 400 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.panel .big { font: 900 clamp(44px, 5vw, 64px)/.9 var(--display); color: var(--white); text-shadow: 0 0 22px rgba(255,45,45,.55); margin-top: 10px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.panel .lbl { font: 700 14px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
.panel img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; margin-top: 8px; filter: saturate(.85) contrast(1.05); max-width: 100%; }
.panel svg.chart { display: block; width: 100%; height: auto; max-height: 200px; margin-top: 6px; }
@keyframes rise { from { opacity: 0; transform: rotateY(var(--ry, 0deg)) translateY(26px) scale(.97); } }

@media (max-width: 1000px) {
  .wall-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); perspective: none; }
  .panel { --ry: 0deg !important; }
  .bottom { grid-template-columns: minmax(0, 1fr); }
  .live, .meter { display: none; }
}
@media (max-width: 600px) {
  .wall-grid { grid-template-columns: minmax(0, 1fr); }
  .panel.wide { grid-column: auto; }
  .brand span, .status { display: none; }
  .tools { margin-left: auto; }
  .tbtn { padding: 6px 8px; letter-spacing: .1em; }
  .subtitle { font-size: 15.5px; }
}
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } .emblem { transition: none; } }
</style>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#axe"/></svg>
    <b>SHANGO</b><span>Thunder core · v1</span>
  </div>
  <div class="status" id="status" data-s="idle" role="status" aria-live="polite"><i></i><span id="statusText">Standing by</span></div>
  <nav class="tools" aria-label="Controls">
    <button class="tbtn wake" id="wakeBtn" type="button">Say “Shango”</button>
    <button class="tbtn" id="histBtn" type="button" aria-expanded="false">Transcript</button>
    <button class="tbtn" id="clearBtn" type="button">Clear view</button>
    <button class="tbtn" id="voiceBtn" type="button" aria-pressed="true">Voice on</button>
    <button class="tbtn" id="resetBtn" type="button">New session</button>
  </nav>
</header>
<div class="timers" id="timers" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Oṣé Ṣàngó: the double-headed thunder axe -->
    <symbol id="axe" viewBox="0 0 100 100">
      <path d="M50 30 C40 18 24 12 10 14 C14 26 14 40 10 52 C24 54 40 48 50 38 Z" fill="#ff2d2d" stroke="#f4efe9" stroke-width="2" stroke-linejoin="round"/>
      <path d="M50 30 C60 18 76 12 90 14 C86 26 86 40 90 52 C76 54 60 48 50 38 Z" fill="#ff2d2d" stroke="#f4efe9" stroke-width="2" stroke-linejoin="round"/>
      <path d="M50 6 L55 14 L50 22 L45 14 Z" fill="#d9a845"/>
      <path d="M50 22 V94" stroke="#f4efe9" stroke-width="4" stroke-linecap="round"/>
      <path d="M44 62 H56 M44 70 H56" stroke="#d9a845" stroke-width="2.5"/>
    </symbol>
  </defs>
</svg>

<div class="emblem" aria-hidden="true">
  <svg viewBox="0 0 100 100"><use href="#axe"/></svg>
  <b>SHANGO</b>
  <small>God of thunder</small>
</div>
<div class="subtitle" id="subtitle" aria-live="polite"></div>

<div class="chips" id="chips">
  <button class="chip" type="button">Shango</button>
  <button class="chip" type="button">Who are you?</button>
  <button class="chip" type="button">Research the Oyo Empire</button>
  <button class="chip" type="button">Weather in Lagos</button>
  <button class="chip" type="button">Set a 2 minute timer</button>
</div>

<footer class="bottom">
  <div class="live" id="live">› <em>Tap the mic or type below.</em></div>
  <form class="composer" id="form" autocomplete="off">
    <button id="mic" type="button" aria-pressed="false" aria-label="Talk to Shango">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <label for="q" hidden>Message</label>
    <input id="q" name="q" type="text" placeholder="Speak or type to Shango…" maxlength="500">
    <button id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div class="meter"><span>SIG</span><div class="bars" id="bars"></div><button class="tbtn" id="muteBtn" type="button" aria-pressed="false">Mute</button></div>
</footer>

<aside class="drawer" id="drawer" hidden aria-label="Transcript">
  <header><span>Transcript · this tab only</span><button class="tbtn" id="closeHist" type="button">Close</button></header>
  <div class="log" id="log"></div>
</aside>

<div class="rcard" id="rcard" hidden aria-live="polite">
  <div class="row"><span>Research // <b id="rState">Active</b></span><span id="rClock">00:00</span></div>
  <h3 id="rTitle"></h3>
  <div class="stage" id="rStage">Starting research agent</div>
  <div class="segs" id="segs"></div>
  <div class="row"><span id="rBlocks">0 blocks</span><span id="rSources">0 sources</span></div>
</div>

<section class="wall" id="wall" hidden aria-label="Research wall">
  <div class="wall-head"><h2 id="wTitle"></h2><p id="wMeta"></p><button class="tbtn" id="closeWall" type="button" style="margin-left:auto">Close wall</button></div>
  <div class="wall-grid" id="wallGrid"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
/* ============================================================
   CONFIG — paste your Cloudflare Worker URL after deploying
   worker.js. Empty: Claude brain inside claude.ai, small offline
   brain anywhere else.
   ============================================================ */
const CONFIG = { endpoint: "/api/brain", maxTurns: 12 };

const PERSONA =
  "You are SHANGO, an AI assistant named after Ṣàngó, the Yoruba orisha of thunder and lightning and legendary fourth Alaafin of the Oyo Empire. " +
  "Speak like a warm, regal king with thunderous wit: confident, generous, a little dramatic, never cruel or crude. You are a public demo on a website. " +
  "Keep replies short: one to three sentences, under 60 words, because they are spoken aloud. Plain text only, no markdown, lists or emoji. " +
  "Tools: weather, Wikipedia, calculator, world time, timers, session notes, and research_topic, which raises a wall of research panels on screen. " +
  "Use research_topic whenever the user asks you to research, investigate, compare or deep-dive a subject, then give a two-sentence spoken summary. " +
  "Never invent facts or numbers a tool can provide. You forget everything when the page closes. Never claim an action you did not perform.";

const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let history = [], notes = [], timers = [];
let state = "idle", busy = false, voiceOn = true, muted = false, walled = false;
let amp = 0.08, ampTarget = 0.08, pulse = 0, flash = 0;

/* ---------- state + transcript ---------- */
const STATE_TEXT = { idle: "Standing by", listening: "Listening", thinking: "Processing", speaking: "Speaking", researching: "Researching", waking: "Awakening" };
function setState(s) {
  state = s; $("status").dataset.s = s; $("statusText").textContent = STATE_TEXT[s];
  document.body.classList.toggle("active", s !== "idle" || walled);
}
function log(kind, text) {
  const e = document.createElement("div"); e.className = "entry " + kind;
  const w = document.createElement("div"); w.className = "who";
  w.textContent = (kind === "me" ? "You" : kind === "ai" ? "Shango" : "Tool") + " · " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const p = document.createElement("p"); p.textContent = text;
  e.append(w, p); $("log").append(e); $("log").scrollTop = $("log").scrollHeight;
}
function setLive(prefix, text) { $("live").replaceChildren("› " + prefix, Object.assign(document.createElement("em"), { textContent: text })); }

/* ============================================================
   TOOLS — free, keyless public APIs, run in the visitor's browser
   ============================================================ */
const WMO = { 0: "clear sky", 1: "mainly clear", 2: "partly cloudy", 3: "overcast", 45: "fog", 48: "rime fog", 51: "light drizzle", 53: "drizzle", 55: "heavy drizzle", 61: "light rain", 63: "rain", 65: "heavy rain", 71: "light snow", 73: "snow", 75: "heavy snow", 80: "rain showers", 81: "rain showers", 82: "violent showers", 95: "thunderstorms", 96: "thunderstorms with hail", 99: "thunderstorms with hail" };
async function getJSON(url) {
  let r; try { r = await fetch(url); } catch { throw new Error("Live data is blocked in this preview. It works on the hosted site."); }

function cleanBlocks(data) {

    if (b?.type === "text" && b.title && b.body) ok.push({ type: "text", title: String(b.title).slice(0, 60), body: String(b.body).slice(0, 360) });

function chartSVG(c) {

  for (let g = 0; g <= 3; g++) { const y = 14 + (H - 14) * g / 3; s += '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y + '" y2="' + y + '" stroke="rgba(244,239,233,.08)"/>'; }

    s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + (i === top ? "#ff2d2d" : "#f4efe9") + '" opacity="' + (i === top ? 1 : .82) + '"/>';
    s += '<text x="' + (x + w / 2) + '" y="' + (y - 4) + '" fill="#f4efe9" font-family="JetBrains Mono, monospace" font-size="9.5" text-anchor="middle">' + esc(fmt(b.value)) + "</text>";
    s += '<text x="' + (x + w / 2) + '" y="' + (H + 16) + '" fill="#8b7f7a" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">' + esc(b.label) + "</text>";

async function research(topic) {

async function askEndpoint(msgs) {
  const convo = msgs.slice();
  for (let round = 0; round < 4; round++) {
    const r = await fetch(CONFIG.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: convo }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "The language core returned " + r.status + ".");
    if (Array.isArray(data.tool_calls) && data.tool_calls.length) {
      convo.push({ role: "assistant", content: data.content || "", tool_calls: data.tool_calls });
      for (const c of data.tool_calls) {
        let a = {}; try { a = JSON.parse(c.function.arguments || "{}"); } catch {}
        const res = await runTool(c.function.name, a);
        convo.push({ role: "tool", tool_call_id: c.id, content: JSON.stringify(res).slice(0, 2000) });
      }

}

let ctl = null;
const RESEARCH_RX = /^(?:please\s+)?(?:research|investigate|deep[- ]dive(?: into)?|tell me everything about)\s+(.+)/i;
async function submit(text) {

  const my = ctl = new AbortController();
  busy = true; $("q").value = ""; $("chips").hidden = true; if (synth) synth.cancel();
  setLive("You: ", text); log("me", text); say("…");
  history.push({ role: "user", content: text }); setState("thinking");
  const slow = setTimeout(() => { if (ctl === my && $("subtitle").textContent === "…") say("Still thinking. If a box asks to let this page use Claude, allow it."); }, 4000);
  let reply = "";
  try {
    const msgs = history.slice(-CONFIG.maxTurns); if (msgs[0].role !== "user") msgs.shift();
    const rm = text.match(RESEARCH_RX);
    if (rm) { const r = await research(rm[1].replace(/[?.!]+$/, "")); reply = r.error || r.spoken_summary || "The wall is raised. Behold."; }
    else if (CONFIG.endpoint) reply = await askEndpoint(msgs);
    else { const s = await samplePromise.catch(() => null); reply = s ? await askClaude(s, msgs, my.signal) : await askOffline(text); }

  } catch (err) {

    if (err?.code === "rate_limited") reply = "Even thunder must rest. Give me a minute.";
    else if (CONFIG.endpoint) reply = "I could not reach my language core. " + (err?.message || "");
    else reply = await askOffline(text).catch(() => "My language core is unreachable just now.");
  }
  clearTimeout(slow);
  if (ctl !== my) return;                     // superseded by a newer message
  ctl = null;
  history.push({ role: "assistant", content: reply }); log("ai", reply); say(reply); setLive("Shango: ", reply);
  if (state !== "researching") setState("thinking");

}

/* ============================================================
   WAKE SEQUENCE — "Shango" → bàtá drums → thunder → demo screens
   Drums are synthesized live with Web Audio: no files.
   ============================================================ */
let actx = null, waking = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { actx = null; } }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function noiseBuf(ctx, secs) {
  const b = ctx.createBuffer(1, ctx.sampleRate * secs, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b;
}
// one drum stroke: a pitched membrane plus a short slap
function drum(ctx, t, f, vol, slap) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(f * 1.6, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + (slap ? 0.18 : 0.45));
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.5);
  const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
  n.buffer = noiseBuf(ctx, 0.1); bp.type = "bandpass"; bp.frequency.value = f * (slap ? 9 : 4); bp.Q.value = 1.2;
  ng.gain.setValueAtTime(vol * (slap ? 0.9 : 0.35), t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  n.connect(bp).connect(ng).connect(ctx.destination); n.start(t);
}
function thunder(ctx, t) {
  const n = ctx.createBufferSource(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
  n.buffer = noiseBuf(ctx, 3.2); lp.type = "lowpass"; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(90, t + 2.8);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 3);
  n.connect(lp).connect(g).connect(ctx.destination); n.start(t);
  const c = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), cg = ctx.createGain();
  c.buffer = noiseBuf(ctx, 0.3); hp.type = "highpass"; hp.frequency.value = 1800;
  cg.gain.setValueAtTime(0.5, t); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  c.connect(hp).connect(cg).connect(ctx.destination); c.start(t);
}
// three bàtá voices: iyá (low), itótele (mid), okónkolo (high); the pattern tightens as it builds
const VOICE = { L: [72, 0.9], M: [140, 0.6], H: [250, 0.45], S: [140, 0.5, 1] };
const PATTERN = "L.H.M.H.L.H.M.HS|L.H.M.HSL.HSM.HS|LHMHLHMHSLMSLMSL";
function playDrums() {
  const ctx = (muted || !voiceOn) ? null : audio();
  const hits = []; let t = 0, step = 0.12;
  for (const ch of PATTERN) {
    if (ch === "|") { step *= 0.78; continue; }
    if (ch !== ".") hits.push([t, ch]);
    t += step;
  }
  const start = ctx ? ctx.currentTime + 0.05 : 0;
  for (const [at, ch] of hits) {
    const [f, v, sl] = VOICE[ch];
    if (ctx) drum(ctx, start + at, f, v, !!sl);
    setTimeout(() => { pulse = 1; if (ch === "L" || ch === "S") flash = Math.max(flash, ch === "L" ? 0.9 : 0.5); }, at * 1000);
  }
  return { total: t, thunderAt: () => { if (ctx) thunder(ctx, ctx.currentTime); } };
}

const DEMO = () => ({

    { type: "text", title: "Who is Ṣàngó", body: "The Yoruba orisha of thunder and lightning, remembered as the fourth Alaafin of Oyo. His signs are the double axe, red and white, and the bàtá drums." },

async function wake() {
  if (waking) return; waking = true;
  if (ctl) { ctl.abort(); ctl = null; }
  if (synth) synth.cancel();
  $("chips").hidden = true; openWall(false); say("");
  log("me", "Shango");
  setState("listening");
  const word = "Shango"; for (let i = 1; i <= word.length; i++) { setLive("You: ", word.slice(0, i)); pulse = 1; await wait(90); }
  say("“Shango”");
  await wait(350);
  setState("waking");
  const d = playDrums();
  await wait(d.total * 1000);
  d.thunderAt(); flash = 1; pulse = 1;
  document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash");
  await wait(500);
  const line = "I am awake. The storm is listening.";
  log("ai", line); say(line); setLive("Shango: ", line);
  renderWall("Wake", DEMO(), [], "Demo · sample screens", "Wake sequence");
  openWall(true);
  await speak(line);
  setState("idle"); waking = false;
}
$("wakeBtn").addEventListener("click", wake);

/* signal meter */
const bars = $("bars"); for (let i = 0; i < 16; i++) bars.append(document.createElement("i"));

/* ============================================================
   THUNDER CORE — Three.js scene with bloom
   ============================================================ */
let core = null;
function initCore() {
  if (!window.THREE || !THREE.EffectComposer || !THREE.UnrealBloomPass) throw new Error("no three");
  const canvas = $("gl");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setClearColor(0x040303, 1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100); camera.position.z = 6;
  const root = new THREE.Group(), gyro = new THREE.Group(); root.add(gyro); scene.add(root);
  const basic = (c, o = 1) => new THREE.MeshBasicMaterial({ color: c, transparent: o < 1, opacity: o });
  const torus = (r, t, c, o) => new THREE.Mesh(new THREE.TorusGeometry(r, t, 12, 220), basic(c, o));
  const ringA = torus(1, 0.032, 0xff2424), ringA2 = torus(0.92, 0.011, 0xff6a4d, 0.9);
  const ringB = torus(1.24, 0.006, 0xffffff, 0.8), ringC = torus(1.42, 0.004, 0xffffff, 0.55), ringD = torus(0.6, 0.006, 0xffffff, 0.7);
  const ringG = torus(1.08, 0.003, 0xd9a845, 0.8);
  gyro.add(ringA, ringA2, ringB, ringC, ringD, ringG);

  const tp = [];
  for (let i = 0; i < 180; i++) { const a = i / 180 * Math.PI * 2, L = i % 15 === 0, r0 = 1.58, r1 = L ? 1.72 : 1.63; tp.push(Math.cos(a) * r0, Math.sin(a) * r0, 0, Math.cos(a) * r1, Math.sin(a) * r1, 0); }
  const tg = new THREE.BufferGeometry(); tg.setAttribute("position", new THREE.Float32BufferAttribute(tp, 3));
  const ticks = new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })); gyro.add(ticks);

  const dp = []; for (let i = 0; i < 96; i++) { const a = i / 96 * Math.PI * 2; if (i % 12 < 9) dp.push(Math.cos(a) * 1.9, Math.sin(a) * 1.9, 0); }
  const dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.Float32BufferAttribute(dp, 3));
  const dots = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xff3b2b, size: 0.04 })); gyro.add(dots);

  const ag = new THREE.BufferGeometry(); ag.setAttribute("position", new THREE.Float32BufferAttribute([-2.7, 0, 0, 2.7, 0, 0], 3));
  const axis = new THREE.Line(ag, new THREE.LineBasicMaterial({ color: 0xff2d2d, transparent: true, opacity: 0.9 })); root.add(axis);

  const sp = []; for (let i = 0; i < 240; i++) { const u = Math.random() * 2 - 1, th = Math.random() * 6.283, r = 1.3 + Math.random() * 1.4, q = Math.sqrt(1 - u * u); sp.push(Math.cos(th) * q * r, u * r * 0.7, Math.sin(th) * q * r); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
  const sparks = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffd9c9, size: 0.016, transparent: true, opacity: 0.7 })); root.add(sparks);

  const BOLTS = 4, SEG = 12;
  const bg = new THREE.BufferGeometry(); bg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(BOLTS * SEG * 6), 3));
  const bolts = new THREE.LineSegments(bg, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 })); gyro.add(bolts);
  function strike() {
    const p = bg.attributes.position.array; let k = 0;
    for (let b = 0; b < BOLTS; b++) {
      const a0 = Math.random() * 6.283, a1 = a0 + (Math.random() - .5) * 1.4;
      const from = [Math.cos(a0) * 1.0, Math.sin(a0) * 1.0, 0], to = [Math.cos(a1) * (1.42 + Math.random() * .4), Math.sin(a1) * (1.42 + Math.random() * .4), (Math.random() - .5) * .3];
      let prev = from;
      for (let s = 1; s <= SEG; s++) {
        const f = s / SEG, j = s === SEG ? 0 : 0.11;
        const cur = [from[0] + (to[0] - from[0]) * f + (Math.random() - .5) * j, from[1] + (to[1] - from[1]) * f + (Math.random() - .5) * j, from[2] + (to[2] - from[2]) * f + (Math.random() - .5) * j];
        p[k++] = prev[0]; p[k++] = prev[1]; p[k++] = prev[2]; p[k++] = cur[0]; p[k++] = cur[1]; p[k++] = cur[2]; prev = cur;
      }
    }
    bg.attributes.position.needsUpdate = true;
  }

  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(512, 512), 1.15, 0.55, 0.04);
  composer.addPass(bloom);

  let W = 1, Hh = 1;
  function resize() {
    W = innerWidth; Hh = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr); renderer.setSize(W, Hh, false); composer.setSize(W, Hh);
    camera.aspect = W / Hh;
    camera.position.z = W / Hh < 0.8 ? 6 / Math.max(0.55, W / Hh / 0.8) : 6;
    camera.updateProjectionMatrix();
    const halfH = camera.position.z * Math.tan(22.5 * Math.PI / 180);
    document.documentElement.style.setProperty("--ring", ((Hh / 2) / halfH) + "px");
  }
  addEventListener("resize", resize); resize();

  let k = 0, lastStrike = 0;
  const pos = new THREE.Vector3(), scl = { v: 1 };
  function render(t) {
    const s = t / 1000, sp = reduceMotion ? 0.2 : 1;
    const active = state !== "idle" || walled;
    k += ((active ? 1 : 0) - k) * 0.05;
    gyro.rotation.x = k * 1.12; gyro.rotation.y = k * 0.48 + Math.sin(s * 0.3) * 0.05 * k;
    gyro.rotation.z = s * 0.08 * sp;
    ringB.rotation.x = k * s * 0.9 * sp; ringC.rotation.y = k * s * 0.6 * sp; ringD.rotation.x = -k * s * 1.3 * sp; ringG.rotation.y = k * (0.6 + s * 0.4 * sp);
    ringA2.rotation.y = k * Math.sin(s * 0.8) * 0.5;
    ticks.rotation.z = -s * 0.05 * sp; dots.rotation.z = s * 0.12 * sp;
    axis.scale.x = Math.max(0.0001, k); axis.material.opacity = 0.85 * k; axis.rotation.z = -0.22;
    sparks.rotation.y = s * 0.05 * sp; sparks.material.opacity = 0.25 + 0.5 * k;
    const sc = 1 + amp * 0.08 + pulse * 0.03;
    // dock into the corner while the research wall is up
    const halfH = camera.position.z * Math.tan(22.5 * Math.PI / 180), halfW = halfH * camera.aspect;
    const target = walled ? new THREE.Vector3(halfW - 0.75, -halfH + 1.15, 0) : new THREE.Vector3(0, 0, 0);
    pos.lerp(target, 0.08); root.position.copy(pos);
    scl.v += ((walled ? 0.28 : 1) - scl.v) * 0.08; root.scale.setScalar(scl.v * sc);
    const zapping = state === "speaking" || state === "thinking" || state === "researching" || state === "waking";
    if (zapping && t - lastStrike > (state === "speaking" ? 70 : 160) && (flash > 0.2 || Math.random() < (state === "speaking" ? .5 : .25))) { strike(); lastStrike = t; bolts.material.opacity = 0.95; }
    bolts.material.opacity *= 0.86;
    bloom.strength = 1.0 + amp * 0.9 + flash * 0.9;
    flash *= 0.88;
    composer.render();
  }
  return { render };
}
try { core = initCore(); } catch (e) { document.body.classList.add("nogl"); const r = Math.min(innerWidth, innerHeight) * 0.2; document.documentElement.style.setProperty("--ring", r + "px"); }

function frame(t) {
  const n = Math.random();
  ampTarget = state === "idle" ? 0.08 + Math.sin(t * 0.0012) * 0.03 : state === "listening" ? 0.3 + n * 0.35 + pulse * 0.3 : state === "speaking" ? 0.45 + n * 0.3 + pulse * 0.3 : 0.2 + Math.sin(t * 0.02) * 0.06;
  pulse *= 0.9; amp += (ampTarget - amp) * 0.12;
  [...bars.children].forEach((b, i) => { const h = Math.max(.12, Math.min(1, amp * (0.6 + Math.sin(i * 1.7 + t * 0.012) * 0.4 + Math.random() * 0.3) * 1.6)); b.style.height = (h * 100) + "%"; b.classList.toggle("hot", h > 0.7); });
  if (core) core.render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
